# USD per 1M tokens, split by the token types TokenTrial reports.
#
# Every entry carries `source`, `checked` (date the source was read) and `verified`.
# `report` refuses to publish leaderboard results while any price it used is unverified.
#
# A `long_context` sub-table gives the prices for a request whose prompt (input +
# cache reads + cache writes) exceeds `threshold` tokens. Each request is priced on
# its own, per the Anthropic pricing page ("Long context pricing").

# --- Anthropic API (first party) -----------------------------------------------
# Source table "Model pricing"; checked 2026-11-12. Cache hits are 0.05x base input
# on Opus 5.5 / Sonnet 5.5 (footnote 2) and 0.1x on other models.

[anthropic."claude-opus-5-5"]
input = 4.00
cache_write_5m = 5.00
cache_write_1h = 8.00
cache_read = 0.20
output = 20.00
source = "https://platform.claude.com/docs/en/about-claude/pricing"
checked = "2026-11-12"
verified = true

[anthropic."claude-sonnet-5-5"]
input = 2.00
cache_write_5m = 2.50
cache_write_1h = 4.00
cache_read = 0.10
output = 10.00
source = "https://platform.claude.com/docs/en/about-claude/pricing"
checked = "2026-11-12"
verified = true

[anthropic."claude-haiku-5-5"]
input = 0.10
cache_write_5m = 0.125
cache_write_1h = 0.20
cache_read = 0.01
output = 0.50
source = "https://platform.claude.com/docs/en/about-claude/pricing"
checked = "2026-11-12"
verified = true

[anthropic."claude-haiku-5-5".long_context]
threshold = 100000
input = 0.50
cache_write_5m = 0.625
cache_write_1h = 1.00
cache_read = 0.05
output = 2.50

[anthropic."claude-haiku-4-5"]
# Not benchmarked: Claude Code 2.1.252 makes a small background call on this model
# in most sessions; it is part of a run's cost.
input = 1.00
cache_write_5m = 1.25
cache_write_1h = 2.00
cache_read = 0.10
output = 5.00
source = "https://platform.claude.com/docs/en/about-claude/pricing"
checked = "2026-11-12"
verified = true

# --- Amazon Bedrock --------------------------------------------------------------
# Source: "Anthropic > On-Demand and Batch pricing", region US East (Ohio); checked
# 2026-11-12. Global cross-region inference matches first-party prices; geo and
# in-region cross-region inference is 1.1x (provider "bedrock-regional").

