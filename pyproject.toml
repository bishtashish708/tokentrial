[project]
name = "tokentrial"
version = "0.0.1"
description = "Benchmark whether token-saving tools for coding agents actually reduce cost per solved task."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashish Bisht" }]
requires-python = ">=3.11"
keywords = ["llm", "benchmark", "coding-agents", "claude-code", "token-cost", "evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "certifi>=2024.2.2",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/bishtashish708/tokentrial"
Issues = "https://github.com/bishtashish708/tokentrial/issues"

[project.scripts]
tokentrial = "tokentrial.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokentrial"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Task repos are fixtures given to the agent (some intentionally buggy); don't lint them.
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Literal log lines reproduced verbatim.
"scripts/make_build_log.py" = ["E501"]
"scripts/make_cart_task.py" = ["E501"]
"scripts/make_git_tasks.py" = ["E501"]
"scripts/make_cron_task.py" = ["E501"]
"scripts/make_cron_tz_task.py" = ["E501"]
"scripts/power_from_pilot.py" = ["E501"]
"scripts/make_site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
