# Retention rules for /var/backups, read by bin/rotate-backups.sh (see SPEC.md).
# Files look like PREFIX-YYYYMMDDTHHMMSS[.ext]. Comments must be on their own line.
#
# KEEP  PREFIX

# nightly pg_dump, two weeks
14      db
# monthly full archive, half a year
6       db-archive
# site tarballs
7       web
3       media cache
# scratch dumps: never keep
0       tmp
